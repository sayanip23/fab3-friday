# Native Streamlit theming.
#
# Palette is Accenture's documented brand purple (#A100FF, PMS 7442 C) —
# the exact value used in the official Round 1 PPTX template — plus black
# and white, Accenture's other brand colours, for a high-contrast look
# rather than a pastel one. Font is Arial, per the official template's own
# stated rule ("use standard Arial font"), so the app and the deck read as
# one submission.

[theme]
base = "light"
primaryColor = "#A100FF"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F2FF"
textColor = "#141414"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
